# Параметры аудита автозакрытия. Скопируйте и измените под конкретный пилот.
# Все величины — до запуска фиксируются в протоколе пилота (docs/pilot-protocol.md).

confidence: 0.95          # уверенность верхних границ (1 − δ)
target_for: 0.01          # порог доли атак среди автозакрытых для решения «можно автоматизировать»
audited_sources:          # какие закрытия проверяем
  - auto                  # ИИ вендора, плейбуки SOAR
  - suppression           # правила подавления и исключения

sampling:
  scheme: uniform         # uniform | stratified | active (active пока экспериментальная: граница приближённая)
  budget: 300             # сколько алертов заказчик готов перепроверить
  seed: 20261027          # фиксируется в протоколе: план выборки воспроизводим
  stratum_column: rule_id # для stratified: обычно правило корреляции
  min_per_stratum: 5      # для stratified: минимум на правило (мелкие правила сливаются в «прочие»)
  active_floor: 0.2       # для active: нижняя граница вероятности отбора как доля равномерной

estimation:
  bound_method: binomial          # binomial — консервативно; hypergeometric — точнее, если выборка — заметная доля
  stratified_method: union        # union — корректно на конечной выборке; korn_graubard — приближённо
  simultaneous_rules: false       # true — поправка Бонферрони на число правил (строже)
  unknown_label_policy: as_attack # «не знаю» считаем атакой (консервативно) или исключаем (exclude)
