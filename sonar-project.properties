# SonarQube: статический анализ исходного кода (SAST, курс DevSecOps; ГОСТ Р 56939-2024, п. 5.10).
# Адрес сервера и токен передаются переменными SONAR_HOST_URL и SONAR_TOKEN (в CI — из Vault).
sonar.projectKey=limen
sonar.projectName=Limen
sonar.projectVersion=0.2.0
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11,3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.exclusions=src/limen/report/templates/**
