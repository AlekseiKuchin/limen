# CI «Лимен»: стиль → тесты → анализ безопасности → сборка → публикация.
# Процессы соотнесены с ГОСТ Р 56939-2024 в docs/compliance/gost-r-56939-2024.md.
#
# Нулевое доверие в конвейере:
# * зависимости ставятся только из requirements/*.txt с проверкой SHA-256;
# * Trivy — из образа, собранного из исходников (toolchain/trivy/Dockerfile) и хранимого в Harbor;
# * пароли Harbor и ключ DefectDojo не хранятся в переменных CI: задания получают их из Vault
#   по JWT задания (toolchain/ci/vault-secret.sh);
# * образ публикуется в Harbor только после сканирования и проверки запуска без сети.

stages: [lint, test, security, build, publish]

variables:
  PYTHON_IMAGE: "python:3.12-slim-trixie"       # в контуре — из Harbor (proxy cache), закреплённый по digest
  TRIVY_IMAGE: "$HARBOR_HOST/limen/trivy:$TRIVY_VERSION"
  IMAGE: "$HARBOR_HOST/limen/limen"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

.python:
  image: $PYTHON_IMAGE
  before_script:
    - python -m pip install --require-hashes -r requirements/dev.txt
    - python -m pip install --no-deps --no-build-isolation -e .

.trivy:
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  rules:
    - if: $HARBOR_HOST && $TRIVY_VERSION

# ----------------------------------------------------------------------------- lint
lint:
  extends: .python
  stage: lint
  script:
    - ruff check src tests scripts
    - ruff format --check src tests scripts

typecheck:
  extends: .python
  stage: lint
  # Строгий mypy с pandas-stubs ещё не прогонялся: после первого зелёного прогона убрать allow_failure.
  allow_failure: true
  script:
    - mypy src/limen

# ----------------------------------------------------------------------------- test
test:
  extends: .python
  stage: test
  script:
    - pytest -m "not research" --cov --cov-report=xml --cov-report=term --junitxml=report.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    paths: [coverage.xml]
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# ----------------------------------------------------------------------------- security
sast-sonarqube:
  stage: security
  image:
    name: sonarsource/sonar-scanner-cli:latest   # закрепить версию и digest в Harbor
    entrypoint: [""]
  needs: [test]
  # В образе сканера нет curl и jq, поэтому SONAR_TOKEN — защищённая маскированная переменная CI
  # с правами только на анализ этого проекта; остальные секреты задания берут из Vault.
  rules:
    - if: $SONAR_HOST_URL && $SONAR_TOKEN
  script:
    - sonar-scanner -Dsonar.qualitygate.wait=true

sca:
  extends: .trivy
  stage: security
  script:
    - trivy fs --scanners vuln --format json --output trivy-sca.json .
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 .
  artifacts:
    when: always
    paths: [trivy-sca.json]

secrets-scan:
  extends: .trivy
  stage: security
  script:
    - trivy fs --scanners secret --exit-code 1 .

misconfig:
  extends: .trivy
  stage: security
  script:
    - trivy config --severity HIGH,CRITICAL --exit-code 1 .

sbom:
  extends: .trivy
  stage: security
  script:
    - trivy fs --format cyclonedx --output sbom.cdx.json .
  artifacts:
    paths: [sbom.cdx.json]
    expire_in: 1 year

defectdojo:
  stage: security
  image: $PYTHON_IMAGE
  needs: [sca]
  id_tokens:
    VAULT_ID_TOKEN:
      aud: "$VAULT_ADDR"
  rules:
    - if: $DD_URL && $DD_ENGAGEMENT_ID && $VAULT_ADDR
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl jq
  script:
    - DD_API_KEY="$(sh toolchain/ci/vault-secret.sh limen/defectdojo api_key)"
    - >
      curl -sS --fail -X POST "$DD_URL/api/v2/import-scan/"
      -H "Authorization: Token $DD_API_KEY"
      -F "scan_type=Trivy Scan" -F "file=@trivy-sca.json"
      -F "engagement=$DD_ENGAGEMENT_ID" -F "active=true" -F "verified=false"

# ----------------------------------------------------------------------------- build
image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_BUILDKIT: "1"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
  script:
    - test -s requirements/runtime.txt || (echo "нет requirements/runtime.txt — выполните make lock" && exit 1)
    - docker build --build-arg PYTHON_IMAGE="$PYTHON_IMAGE" -t "limen:$CI_COMMIT_SHORT_SHA" .
    - docker run --rm --network none --read-only --cap-drop ALL "limen:$CI_COMMIT_SHORT_SHA" version
    - docker save "limen:$CI_COMMIT_SHORT_SHA" -o limen-image.tar
  artifacts:
    paths: [limen-image.tar]
    expire_in: 1 day

image-scan:
  extends: .trivy
  stage: build
  needs: [image]
  script:
    - trivy image --input limen-image.tar --severity HIGH,CRITICAL --exit-code 1

# ----------------------------------------------------------------------------- publish
publish-harbor:
  stage: publish
  image: docker:27
  services: [docker:27-dind]
  needs: [image, image-scan]
  id_tokens:
    VAULT_ID_TOKEN:
      aud: "$VAULT_ADDR"
  rules:
    - if: $CI_COMMIT_TAG && $HARBOR_HOST && $VAULT_ADDR
  before_script:
    - apk add --no-cache curl jq
  script:
    - docker load -i limen-image.tar
    - HARBOR_USER="$(sh toolchain/ci/vault-secret.sh limen/harbor username)"
    - sh toolchain/ci/vault-secret.sh limen/harbor password | docker login "$HARBOR_HOST" -u "$HARBOR_USER" --password-stdin
    - docker tag "limen:$CI_COMMIT_SHORT_SHA" "$IMAGE:$CI_COMMIT_TAG"
    - docker push "$IMAGE:$CI_COMMIT_TAG"
